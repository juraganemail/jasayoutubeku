<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin YouTube</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#07070a;
    color:#fff;
    font-family:Arial,sans-serif;
}

.hidden{
    display:none!important;
}

#loginPage{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.box{
    width:100%;
    max-width:400px;
    background:#111118;
    border:1px solid #292936;
    border-radius:18px;
    padding:25px;
}

h1{
    margin-top:0;
}

p{
    color:#999;
}

input{
    width:100%;
    padding:13px;
    margin:7px 0 15px;
    background:#08080c;
    color:white;
    border:1px solid #333;
    border-radius:9px;
    outline:none;
}

button{
    width:100%;
    padding:13px;
    border:0;
    border-radius:9px;
    background:#7c3aed;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

#message{
    margin-bottom:15px;
    padding:12px;
    border-radius:9px;
    background:#241116;
    color:#ff9b9b;
    display:none;
    line-height:1.5;
}

#adminPage{
    min-height:100vh;
}

.top{
    height:65px;
    padding:0 20px;
    border-bottom:1px solid #292936;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logout{
    width:auto;
    padding:9px 15px;
    background:#29202f;
}

.main{
    padding:25px;
}

.card{
    background:#111118;
    border:1px solid #292936;
    border-radius:15px;
    padding:20px;
    margin-bottom:15px;
}

.ok{
    color:#4ade80;
}

.bad{
    color:#f87171;
}

pre{
    white-space:pre-wrap;
    word-break:break-word;
    color:#bbb;
}
</style>
</head>

<body>


<!-- LOGIN -->

<div id="loginPage">

    <div class="box">

        <h1>🎬 Admin Panel</h1>

        <p>
            YouTube Monetization Service
        </p>

        <div id="message"></div>

        <form id="loginForm">

            <label>Email</label>

            <input
                id="email"
                type="email"
                required
                autocomplete="username"
                placeholder="Email admin"
            >

            <label>Password</label>

            <input
                id="password"
                type="password"
                required
                autocomplete="current-password"
                placeholder="Password admin"
            >

            <button type="submit">
                LOGIN ADMIN
            </button>

        </form>

    </div>

</div>


<!-- ADMIN -->

<div id="adminPage" class="hidden">

    <div class="top">

        <strong>
            🎬 YOUTUBE ADMIN
        </strong>

        <button
            id="logout"
            class="logout"
        >
            Logout
        </button>

    </div>

    <div class="main">

        <div class="card">

            <h2>
                Dashboard Admin
            </h2>

            <p id="adminEmail">
                -
            </p>

            <p id="adminRole">
                Memeriksa role...
            </p>

        </div>


        <div class="card">

            <h3>Status Sistem</h3>

            <div id="systemStatus">
                Memeriksa sistem...
            </div>

        </div>


        <div class="card">

            <h3>Hasil Database</h3>

            <pre id="databaseResult">
Belum diperiksa.
            </pre>

        </div>

    </div>

</div>


<script>

/* =========================================================
   SUPABASE CONFIG
   ========================================================= */

const SUPABASE_URL =
    "GANTI_DENGAN_URL_SUPABASE_ANDA";

const SUPABASE_ANON_KEY =
    "GANTI_DENGAN_ANON_KEY_ANDA";


/* =========================================================
   ELEMENT
   ========================================================= */

const loginPage =
    document.getElementById("loginPage");

const adminPage =
    document.getElementById("adminPage");

const message =
    document.getElementById("message");

const loginForm =
    document.getElementById("loginForm");

const systemStatus =
    document.getElementById("systemStatus");

const databaseResult =
    document.getElementById("databaseResult");


/* =========================================================
   VALIDASI CONFIG
   ========================================================= */

if(
    SUPABASE_URL.includes("https://qnvptfefmbxiaynuhfcx.supabase.co") ||
    SUPABASE_ANON_KEY.includes("sb_publishable_67asK3gfVhUIpNeEs2uOPQ_2kF4AMQf")
){

    showError(
        "URL Supabase atau ANON KEY belum dimasukkan ke admin.html."
    );

}


/* =========================================================
   CEK SUPABASE LIBRARY
   ========================================================= */

if(
    typeof window.supabase === "undefined"
){

    showError(
        "Library Supabase tidak berhasil dimuat. Periksa koneksi internet."
    );

}


/* =========================================================
   CLIENT
   ========================================================= */

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =========================================================
   LOGIN
   ========================================================= */

loginForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        clearMessage();

        const email =
            document
            .getElementById("email")
            .value
            .trim();

        const password =
            document
            .getElementById("password")
            .value;

        showMessage(
            "Sedang login..."
        );

        try{

            const result =
                await withTimeout(
                    supabaseClient
                    .auth
                    .signInWithPassword({
                        email,
                        password
                    }),
                    10000
                );

            if(result.error){

                throw result.error;

            }

            if(!result.data.user){

                throw new Error(
                    "Login berhasil tetapi user tidak ditemukan."
                );

            }

            await checkAdmin(
                result.data.user
            );

        }catch(error){

            console.error(error);

            showError(
                "LOGIN ERROR:\n" +
                (
                    error.message ||
                    String(error)
                )
            );

        }

    }
);


/* =========================================================
   CHECK ADMIN
   ========================================================= */

async function checkAdmin(user){

    showMessage(
        "Login berhasil. Memeriksa profile..."
    );

    try{

        const result =
            await withTimeout(

                supabaseClient
                .from("profiles")
                .select(
                    "id,email,role,full_name"
                )
                .eq(
                    "id",
                    user.id
                )
                .maybeSingle(),

                10000
            );


        if(result.error){

            throw result.error;

        }


        const profile =
            result.data;


        if(!profile){

            throw new Error(
                "Akun berhasil login tetapi belum mempunyai profile di tabel profiles."
            );

        }


        if(profile.role !== "admin"){

            throw new Error(
                "Akun ini bukan admin.\nRole saat ini: " +
                profile.role
            );

        }


        /* ADMIN BERHASIL */

        loginPage
            .classList
            .add("hidden");

        adminPage
            .classList
            .remove("hidden");


        document
            .getElementById(
                "adminEmail"
            )
            .textContent =
                profile.email ||
                user.email;


        document
            .getElementById(
                "adminRole"
            )
            .innerHTML =
                'Role: <strong class="ok">ADMIN</strong>';


        systemStatus.innerHTML =
            '<span class="ok">✓ Supabase terhubung</span>';


        databaseResult.textContent =
            JSON.stringify(
                profile,
                null,
                2
            );


    }catch(error){

        console.error(error);

        showError(
            "CHECK ADMIN ERROR:\n" +
            (
                error.message ||
                String(error)
            )
        );

    }

}


/* =========================================================
   CEK SESSION SAAT HALAMAN DIBUKA
   ========================================================= */

(async function(){

    try{

        const result =
            await withTimeout(

                supabaseClient
                .auth
                .getSession(),

                10000

            );


        if(result.error){

            throw result.error;

        }


        const session =
            result.data.session;


        if(session){

            await checkAdmin(
                session.user
            );

        }

    }catch(error){

        console.error(error);

        showError(
            "SESSION ERROR:\n" +
            (
                error.message ||
                String(error)
            )
        );

    }

})();


/* =========================================================
   LOGOUT
   ========================================================= */

document
    .getElementById("logout")
    .addEventListener(
        "click",
        async function(){

            await supabaseClient
                .auth
                .signOut();

            location.reload();

        }
    );


/* =========================================================
   TIMEOUT
   ========================================================= */

function withTimeout(
    promise,
    milliseconds
){

    return Promise.race([

        promise,

        new Promise(
            (_,reject)=>{

                setTimeout(
                    ()=>{

                        reject(
                            new Error(
                                "Permintaan ke Supabase timeout setelah " +
                                milliseconds +
                                " ms."
                            )
                        );

                    },
                    milliseconds
                );

            }
        )

    ]);

}


/* =========================================================
   MESSAGE
   ========================================================= */

function showMessage(text){

    message.style.display =
        "block";

    message.style.background =
        "#17172a";

    message.style.color =
        "#c4b5fd";

    message.textContent =
        text;

}


function showError(text){

    message.style.display =
        "block";

    message.style.background =
        "#281217";

    message.style.color =
        "#ff9b9b";

    message.textContent =
        text;

}


function clearMessage(){

    message.style.display =
        "none";

    message.textContent =
        "";

}

</script>

</body>
</html>
