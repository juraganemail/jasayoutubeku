<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#07070a;
    color:white;
    font-family:Arial,sans-serif;
}

.container{
    width:100%;
    max-width:430px;
    margin:auto;
    padding:25px;
}

.login-box{
    margin-top:100px;
    padding:28px;
    background:#111116;
    border:1px solid #30303b;
    border-radius:20px;
}

.logo{
    text-align:center;
    font-size:70px;
    margin-bottom:10px;
}

h1{
    text-align:center;
    margin:0 0 8px;
    font-size:36px;
}

.subtitle{
    text-align:center;
    color:#999;
    margin-bottom:30px;
}

label{
    display:block;
    margin:15px 0 7px;
    font-size:17px;
}

input{
    width:100%;
    padding:15px;
    background:#07070a;
    color:white;
    border:1px solid #3a3a45;
    border-radius:10px;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#7c3aed;
}

button{
    width:100%;
    margin-top:22px;
    padding:15px;
    background:#7c3aed;
    color:white;
    border:0;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
}

button:active{
    transform:scale(.98);
}

#status{
    margin-top:18px;
    padding:12px;
    border-radius:10px;
    background:#191922;
    color:#aaa;
    text-align:center;
    line-height:1.5;
    word-break:break-word;
}

#dashboard{
    display:none;
}

.top{
    padding:20px;
    border-bottom:1px solid #292933;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.content{
    padding:20px;
}

.card{
    background:#111116;
    border:1px solid #292933;
    border-radius:15px;
    padding:20px;
    margin-bottom:15px;
}

.logout{
    width:auto;
    margin:0;
    padding:9px 15px;
    background:#2a1b30;
}

.green{
    color:#4ade80;
}

.red{
    color:#f87171;
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginPage">

<div class="container">

<div class="login-box">

<div class="logo">🎬</div>

<h1>Admin Panel</h1>

<div class="subtitle">
YouTube Monetization Service
</div>

<label>Email</label>

<input
    id="email"
    type="email"
    placeholder="Email admin"
    autocomplete="username"
>

<label>Password</label>

<input
    id="password"
    type="password"
    placeholder="Password admin"
    autocomplete="current-password"
>

<button
    id="loginButton"
    type="button"
>
LOGIN ADMIN
</button>

<div id="status">
Sistem siap. Silakan login.
</div>

</div>

</div>

</div>


<!-- DASHBOARD -->

<div id="dashboard">

<div class="top">

<strong>🎬 YOUTUBE ADMIN</strong>

<button
    id="logoutButton"
    class="logout"
>
LOGOUT
</button>

</div>

<div class="content">

<div class="card">

<h2>Dashboard Admin</h2>

<p id="adminEmail"></p>

<p>
Role:
<strong
    id="adminRole"
    class="green"
>
ADMIN
</strong>
</p>

</div>

<div class="card">

<h3>System Status</h3>

<p class="green">
✓ Login berhasil
</p>

<p>
Supabase berhasil terhubung.
</p>

</div>

</div>

</div>


<script>

/* =====================================================
   CONFIG SUPABASE
   ===================================================== */

const SUPABASE_URL =
"https://qnvptfefmbxiaynuhfcx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_67asK3gfVhUIpNeEs2uOPQ_2kF4AMQf";


/* =====================================================
   ELEMENT
   ===================================================== */

const loginPage =
document.getElementById("loginPage");

const dashboard =
document.getElementById("dashboard");

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const loginButton =
document.getElementById("loginButton");

const logoutButton =
document.getElementById("logoutButton");

const statusBox =
document.getElementById("status");


/* =====================================================
   STATUS
   ===================================================== */

function status(text, type){

    statusBox.textContent = text;

    if(type === "success"){

        statusBox.className = "green";

    }else if(type === "error"){

        statusBox.className = "red";

    }else{

        statusBox.className = "";

    }

}


/* =====================================================
   START
   ===================================================== */

try{

    if(
        !SUPABASE_URL ||
        SUPABASE_URL.includes("GANTI_DENGAN")
    ){

        throw new Error(
            "SUPABASE_URL belum diganti."
        );

    }

    if(
        !SUPABASE_KEY ||
        SUPABASE_KEY.includes("GANTI_DENGAN")
    ){

        throw new Error(
            "SUPABASE_KEY belum diganti."
        );

    }

    if(
        !window.supabase
    ){

        throw new Error(
            "Library Supabase tidak termuat."
        );

    }


    const client =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    status(
        "✓ Sistem siap. Tombol login aktif."
    );


    /* =================================================
       LOGIN
       ================================================= */

    loginButton.onclick = async function(){

        status(
            "⏳ Tombol berhasil ditekan. Menghubungkan ke Supabase..."
        );


        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;


        if(!email){

            status(
                "Email belum diisi.",
                "error"
            );

            emailInput.focus();

            return;

        }


        if(!password){

            status(
                "Password belum diisi.",
                "error"
            );

            passwordInput.focus();

            return;

        }


        loginButton.disabled = true;

        loginButton.textContent =
            "MEMPROSES...";


        try{

            const response =
                await client.auth.signInWithPassword({

                    email:email,

                    password:password

                });


            if(response.error){

                throw response.error;

            }


            if(!response.data){

                throw new Error(
                    "Supabase tidak mengembalikan data login."
                );

            }


            const user =
                response.data.user;


            if(!user){

                throw new Error(
                    "User tidak ditemukan setelah login."
                );

            }


            status(
                "✓ Login berhasil. Memeriksa akun admin..."
            );


            const profileResponse =
                await client
                .from("profiles")
                .select("id,email,role")
                .eq("id",user.id)
                .maybeSingle();


            if(profileResponse.error){

                throw profileResponse.error;

            }


            const profile =
                profileResponse.data;


            if(!profile){

                throw new Error(
                    "Akun login tidak memiliki profile di tabel profiles."
                );

            }


            if(profile.role !== "admin"){

                throw new Error(
                    "Akun berhasil login tetapi role bukan admin. Role saat ini: " +
                    profile.role
                );

            }


            /* ==========================================
               BERHASIL
               ========================================== */

            status(
                "✓ LOGIN ADMIN BERHASIL",
                "success"
            );


            setTimeout(function(){

                loginPage.style.display =
                    "none";

                dashboard.style.display =
                    "block";

                document
                .getElementById("adminEmail")
                .textContent =
                    profile.email ||
                    user.email;

            },500);


        }catch(error){

            console.error(
                "LOGIN ERROR:",
                error
            );


            status(
                "❌ " +
                (
                    error.message ||
                    String(error)
                ),
                "error"
            );

        }


        loginButton.disabled = false;

        loginButton.textContent =
            "LOGIN ADMIN";

    };


    /* =================================================
       LOGOUT
       ================================================= */

    logoutButton.onclick =
    async function(){

        await client.auth.signOut();

        location.reload();

    };


}catch(error){

    console.error(error);

    status(
        "❌ " +
        error.message,
        "error"
    );

}

</script>

</body>
</html>
